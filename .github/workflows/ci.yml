name: Test and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test recognition and Zotero API integration mocks
        run: node tests.mjs
      - name: Build XPI
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-cs-venues
          path: cs-venues-title-*.xpi
          if-no-files-found: error
